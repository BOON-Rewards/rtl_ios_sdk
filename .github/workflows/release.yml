# Source: sdks/release/ios.yml in the monorepo. Exported by dev-cli.
name: SDK release

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: SDK checks
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Scan public snapshot for credentials
        run: node .github/gitleaks.mjs .
      - name: Validate release metadata
        id: metadata
        run: node .github/sdk-release.mjs metadata
      - name: Build and check SDK
        run: node .github/sdk-release.mjs check

  publish:
    name: Publish SDK
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: sdk-release-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Scan public snapshot for credentials
        run: node .github/gitleaks.mjs .
      # Merging the release PR approves publication. No additional approval or
      # tag-triggered workflow is needed. The helper never moves existing tags.
      - name: Tag and publish the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/sdk-release.mjs publish
